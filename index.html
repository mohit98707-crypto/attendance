<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b7f4b"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Attendance</title><script src="config.js"></script>
<style>
:root{--g:#1b7f4b;--g2:#145c37;--bg:#f2f7f4;--c:#fff;--t:#14231b;--m:#6b7d73;--b:#dbe8e0;--r:#c0392b;--a:#e8f5ee}
@media(prefers-color-scheme:dark){:root{--bg:#0e1612;--c:#16211b;--t:#e8f1ec;--m:#93a79b;--b:#26372d;--a:#1d3326}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0003}
main{max-width:560px;margin:auto;padding:14px}.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
input,textarea{width:100%;padding:13px;margin:6px 0;border:1px solid var(--b);border-radius:10px;font-size:16px;background:var(--bg);color:var(--t)}
button{font:inherit;cursor:pointer}.bt{width:100%;padding:14px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:17px;margin-top:6px}.bt.gh{background:var(--r)}
.pb{display:block;margin:16px auto 10px;width:190px;height:190px;border-radius:50%;border:0;color:#fff;font-size:24px;font-weight:700;background:radial-gradient(circle at 30% 25%,#2fa768,var(--g));animation:pl 2.4s infinite}
.pb.out{background:radial-gradient(circle at 30% 25%,#e2574a,var(--r));animation-name:pr}
@keyframes pl{0%,100%{box-shadow:0 10px 24px #1b7f4b55,0 0 0 0 #1b7f4b33}50%{box-shadow:0 10px 24px #1b7f4b55,0 0 0 16px #1b7f4b00}}
@keyframes pr{0%,100%{box-shadow:0 10px 24px #c0392b55,0 0 0 0 #c0392b33}50%{box-shadow:0 10px 24px #c0392b55,0 0 0 16px #c0392b00}}
.pb:disabled{opacity:.6;animation:none}.mu{color:var(--m);font-size:14px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k div{background:var(--a);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--m)}.k b{display:block;font-size:20px;color:var(--t)}
.ss{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b)}.ss:last-child{border:0}
.chip{display:inline-block;padding:3px 12px;border-radius:20px;background:var(--a);color:var(--g);font-size:13px}.av{width:64px;height:64px;border-radius:50%;background:var(--g);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;border:0;background:none;padding:8px 0;color:var(--m);font-size:12px}nav button i{display:block;font-style:normal;font-size:22px}nav button.cur{color:var(--g);font-weight:700}
button:active,button.on,button.busy{filter:brightness(.65);transform:scale(.98)}.lk{background:none;border:0;color:var(--g);padding:8px}
#ld{position:fixed;top:0;left:0;height:4px;width:0;background:#f5b700;transition:width .5s;z-index:9}
#m{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:10px;color:#fff;display:none;z-index:9;max-width:90%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left}
</style></head><body>
<header><b>&#9201; Attendance</b><span id=w></span></header><main id=a></main><nav id=nv></nav><div id=ld></div><div id=m></div>
<script>
let U=null;try{U=JSON.parse(localStorage.getItem('u'))}catch(e){}
const $=i=>document.getElementById(i);
const hm=h=>{if(h==null||h==='')return'--:--';const m=Math.round(h*60);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const tm=s=>s?s.slice(11,16):'--:--';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LC=0;function ld(d){LC+=d;$('ld').style.width=LC>0?'85%':'0'}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.disabled){b.classList.add('on');setTimeout(()=>b.classList.remove('on'),700)}});
function toast(t,bad){const m=$('m');m.textContent=t;m.style.background=bad?'#c0392b':'#1b7f4b';m.style.display='block';setTimeout(()=>m.style.display='none',4000)}
function call(a,p){ld(1);return callRaw(a,p).finally(()=>ld(-1))}
function callRaw(a,p){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tok:U?U.token:'',act:a,p:p||{}})}).then(r=>r.json()).then(r=>{if(r.ok)return r.data;if(r.error=='SESSION'){out();throw new Error('Please login again.')}throw new Error(r.error)},e=>{throw new Error('No internet. Please try again.')})}
function out(){U=null;try{localStorage.removeItem('u')}catch(e){}boot()}
let TAB='home',ST=null,TIMER=null,RECV=0,LOC=null,WID=null,LAST=0,DENY=0;
function boot(){clearInterval(TIMER);$('w').innerHTML=U?esc(U.name):'';$('nv').style.display=U?'flex':'none';
 if(!U)return $('a').innerHTML='<div class=card style="margin-top:40px;text-align:center"><div style="font-size:44px">&#9201;</div><h2>Attendance</h2><input id=i placeholder="Employee ID" autocapitalize=characters><input id=p type=password placeholder=Password><button id=lb class=bt onclick="login()">Login</button></div>';
 shell('home')}
function shell(t){TAB=t;clearInterval(TIMER);const T=[['home','&#127968;','Home'],['hist','&#128344;','History'],['reg','&#128221;','Regularize'],['prof','&#128100;','Profile']];
 $('nv').innerHTML=T.map(x=>'<button class="'+(x[0]==t?'cur':'')+'" data-t="'+x[0]+'" onclick="shell(this.dataset.t)"><i>'+x[1]+'</i>'+x[2]+'</button>').join('');
 ({home:home,hist:hist,reg:regPage,prof:prof})[t]()}
async function login(){const lb=$('lb');lb.classList.add('busy');lb.textContent='Please wait…';try{U=await call('login',{id:$('i').value,pw:$('p').value});try{localStorage.setItem('u',JSON.stringify(U))}catch(e){}boot()}catch(e){toast(e.message,1);lb.classList.remove('busy');lb.textContent='Login'}}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function tick(){const e=$('ck');if(e)e.textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const l=$('lv');if(l&&ST&&ST.openMs){const s=Math.max(0,Math.floor((ST.now-ST.openMs+Date.now()-RECV)/1000));l.textContent='Working '+String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}
async function home(s){try{s=s||await call('today');ST=s;RECV=Date.now();const w=s.btn=='out';
 $('a').innerHTML='<div class=card style="text-align:center"><div style="font-size:20px;font-weight:700">'+greet()+', '+esc(s.name.split(' ')[0])+'</div><div class=mu>'+s.date+' · <span id=ck></span></div>'
 +'<button id=b class="pb'+(w?' out':'')+'" data-t="'+s.btn+'" onclick="punch(this.dataset.t)">'+(w?'Punch Out':'Punch In')+'</button><div id=lv class=chip>'+(w?'Working':'Ready to punch in')+'</div></div>'
 +'<div class="card k"><div>Today total<b>'+hm(s.net)+'</b></div><div>Overtime<b>'+hm(s.ot)+'</b></div><div>Sessions<b>'+s.sessions.length+'</b></div></div>'
 +'<div class=card><b>Today&#39;s punches</b>'+(s.sessions.length?s.sessions.map((x,i)=>'<div class=ss><span><b>#'+(i+1)+'</b> &nbsp;'+tm(x.in)+' – '+(x.out?tm(x.out):'<i>working…</i>')+'</span><span class=mu>'+(x.h!=null?hm(x.h):'')+'</span></div>').join(''):'<div class=mu style="padding:10px 0">No punches yet today.</div>')+(s.ot>0?'<div style="margin-top:8px">Overtime status: <span class=chip>'+esc(s.st)+'</span></div>':'')+'</div>';
 clearInterval(TIMER);TIMER=setInterval(tick,1000);tick();warm()}catch(e){toast(e.message,1)}}
function warm(){try{if(!navigator.geolocation||WID!=null)return;DENY=0;WID=navigator.geolocation.watchPosition(p=>{const q=p.coords,n=Date.now();LAST=n;if(!LOC||q.accuracy<=LOC.acc||n-LOC.t>20000)LOC={lat:q.latitude,lng:q.longitude,acc:q.accuracy,t:n}},()=>{DENY=1},{enableHighAccuracy:true,maximumAge:0});setTimeout(()=>{try{navigator.geolocation.clearWatch(WID)}catch(e){}WID=null},30000)}catch(e){}}
function getLoc(){return new Promise(res=>{try{warm();let n=0;const give=()=>(LOC&&Date.now()-LAST<30000)?{lat:LOC.lat,lng:LOC.lng,acc:LOC.acc}:null;
 const iv=setInterval(()=>{n++;const g=give();if((g&&g.acc<=30)||DENY||n>=30){clearInterval(iv);res(g)}},150)}catch(e){res(null)}})}
async function punch(t){if(t=='out'&&!confirm('Punch Out now?'))return;const b=$('b');b.disabled=true;b.classList.add('busy');b.textContent='Please wait…';
 try{const loc=await getLoc(),d=await call('punch',{type:t,loc:loc});toast(t=='in'?'Punched in ✔':'Punched out ✔');home(d)}catch(e){toast(e.message,1);home()}}
async function hist(m){try{const d=await call('hist',{month:typeof m=='string'?m:''}),r=d.days;let nt=0,ot=0;r.forEach(x=>{nt+=x.net||0;ot+=x.ot||0});
 $('a').innerHTML='<div class=card><b>Attendance history</b><input type=month id=mf value="'+d.month+'" onchange="hist(this.value)"><div class=k><div>Days<b>'+r.length+'</b></div><div>Worked<b>'+hm(nt)+'</b></div><div>Overtime<b>'+hm(ot)+'</b></div></div></div>'
 +(r.length?r.map(x=>'<div class=card><div style="display:flex;justify-content:space-between"><b>'+new Date(x.date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'})+'</b><span><b>'+hm(x.net)+'</b>'+(x.ot>0?' <span class=chip>OT '+hm(x.ot)+' · '+esc(x.st)+'</span>':'')+'</span></div><div class=mu style="margin-top:6px">'+x.s.map(y=>tm(y.in)+' – '+(y.out?tm(y.out):'working')).join(' &nbsp;|&nbsp; ')+'</div></div>').join(''):'<div class="card mu">No attendance in this month.</div>')}catch(e){toast(e.message,1)}}
async function regPage(){try{const r=await call('myreg');
 $('a').innerHTML='<div class=card><b>Forgot to punch? Request a correction</b><p class=mu>Admin will review it. Enter the times you actually worked.</p>Date<input type=date id=rd><div class=row style="display:flex;gap:8px"><div style="flex:1">Punch In<input type=time id=ri></div><div style="flex:1">Punch Out<input type=time id=ro></div></div><input id=rr placeholder="Reason (e.g. forgot to punch)"><button class=bt onclick="sendReg()">Send request</button></div><div class=card><b>My requests</b><table><tr><th>Date</th><th>In</th><th>Out</th><th>Status</th></tr>'+r.map(x=>'<tr><td>'+x.date.slice(5)+'</td><td>'+tm(x.tin)+'</td><td>'+tm(x.tout)+'</td><td>'+esc(x.st)+(x.note?'<br><small>'+esc(x.note)+'</small>':'')+'</td></tr>').join('')+'</table></div>'}catch(e){toast(e.message,1)}}
async function sendReg(){try{await call('reg',{date:$('rd').value,tin:$('ri').value,tout:$('ro').value,reason:$('rr').value});toast('Request sent to admin ✔');regPage()}catch(e){toast(e.message,1)}}
function prof(){$('a').innerHTML='<div class=card style="text-align:center"><div class=av>'+esc(U.name.charAt(0))+'</div><b>'+esc(U.name)+'</b><div class=mu>ID: '+esc(U.id)+'</div></div><div class=card><b>Change password</b><input id=op type=password placeholder="Current password"><input id=np type=password placeholder="New password (min 4 characters)"><button class=bt onclick="chp()">Update password</button></div><div class=card><button class="bt gh" onclick="out()">Logout</button></div>'}
async function chp(){try{await call('chpw',{op:$('op').value,np:$('np').value});toast('Password updated ✔');$('op').value='';$('np').value=''}catch(e){toast(e.message,1)}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
